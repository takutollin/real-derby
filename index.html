<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALL IN POKER</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#06251a;color:#fff;font-family:Arial,"Noto Sans JP",sans-serif;text-align:center}
.game{width:96%;max-width:1100px;margin:auto;padding:18px 8px 60px}h1{font-size:46px;margin:4px}.subtitle{color:#aaa;margin-bottom:14px}
.setup{margin:12px auto 18px}.setup label{margin-right:8px;color:#c8d4ce}.setup select{font-size:17px;padding:7px 12px;border-radius:8px}
.players{display:grid;grid-template-columns:repeat(2,minmax(230px,1fr));gap:14px;max-width:850px;margin:auto}
.player{padding:10px;background:#ffffff08;border:1px solid #ffffff12;border-radius:14px}.player h2{margin:3px 0 9px;font-size:21px}
.cards,.board{display:flex;justify-content:center;gap:8px}.card{width:70px;height:100px;background:#fff;color:#111;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;box-shadow:0 4px 10px #0006;cursor:pointer;border:3px solid transparent}.card:hover{border-color:#eab308}.red{color:#d52b2b}
.player-equity{font-size:20px;font-weight:bold;margin-top:8px}.board-title{color:#aaa;margin:17px 0 7px}.board{min-height:100px}
.placeholder{width:70px;height:100px;border:2px dashed #ffffff35;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#ffffff45;font-size:24px}
.equity{display:none}.small{font-size:12px;color:#aebdb5}
.result{min-height:62px;margin-top:17px;font-size:28px;font-weight:bold}.hand-name{display:block;font-size:17px;color:#ccc;margin-top:6px}
button{margin:7px;padding:14px 27px;border:0;border-radius:10px;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}#random{background:#2563eb}#action{background:#e6323e}.hint{font-size:14px;color:#b8c5be;margin:9px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.box{background:#102d23;border-radius:16px;width:min(780px,97vw);max-height:90vh;overflow:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0}.close{background:#475569;padding:8px 13px}
.srow{display:grid;grid-template-columns:42px repeat(13,1fr);gap:5px;margin:7px 0;align-items:center}.slab{font-size:25px;font-weight:bold}.pick{padding:9px 2px;margin:0;background:#f8fafc;color:#111;border-radius:7px;font-size:14px}.pick.r{color:#d52b2b}.pick:disabled{background:#64748b;color:#cbd5e1}
@media(max-width:700px){h1{font-size:35px}.players{grid-template-columns:1fr 1fr;gap:7px}.player{padding:7px}.player h2{font-size:16px}.card,.placeholder{width:54px;height:78px;font-size:19px}.player-equity{font-size:16px}.srow{grid-template-columns:30px repeat(7,1fr)}.pick{font-size:12px}}


.player.winner{
  border:2px solid #ffd700;
  background:#ffd70012;
  animation:winnerGlow 1.2s ease-out forwards;
}

@keyframes winnerGlow{
  0%{
    transform:scale(1);
    box-shadow:0 0 0 #ffd700;
  }
  30%{
    transform:scale(1.025);
    box-shadow:
      0 0 20px #ffd700,
      0 0 45px #ffd700aa;
  }
  60%{
    transform:scale(1);
    box-shadow:
      0 0 8px #ffd700,
      0 0 20px #ffd70080;
  }
  100%{
    transform:scale(1);
    box-shadow:
      0 0 12px #ffd700,
      0 0 28px #ffd70080;
  }
}



/* Baccarat-style squeeze reveal for community cards */
.squeeze-card{position:relative;width:70px;height:100px;border-radius:9px;perspective:700px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;filter:drop-shadow(0 4px 10px #0006)}
.squeeze-card:active{cursor:grabbing}
.squeeze-face{position:absolute;inset:0;width:100%;height:100%;border-radius:9px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;overflow:hidden;opacity:0;z-index:1;pointer-events:none}
.squeeze-face.red{color:#d52b2b}
.squeeze-cover{position:absolute;inset:0;border-radius:9px;background:repeating-linear-gradient(45deg,#0d315f 0 8px,#174b88 8px 16px);border:3px solid #e8edf5;box-shadow:inset 0 0 0 2px #ffffff55;transform-origin:bottom center;will-change:transform,clip-path;transition:transform .16s ease-out,clip-path .16s ease-out,opacity .16s ease-out;z-index:2}
.squeeze-cover::after{content:"♠";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;opacity:.85}
.squeeze-card.squeezing .squeeze-face,.squeeze-card.revealed .squeeze-face{opacity:1}
.squeeze-card.squeezing .squeeze-cover{transition:none}
.squeeze-card.revealed{cursor:default}
.squeeze-card.revealed .squeeze-cover{transform:translateY(-105%) rotateX(-22deg);clip-path:inset(0 0 100% 0);opacity:0;pointer-events:none}
.squeeze-help{font-size:12px;color:#aebdb5;margin-top:7px;min-height:15px}
@media(max-width:700px){.squeeze-card{width:54px;height:78px}.squeeze-face{font-size:19px}.squeeze-cover::after{font-size:28px}}


/* Classic playing-card face */
.card,.squeeze-face{position:relative;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
.playing-card{position:relative;width:100%;height:100%;background:#fff;color:#111;border-radius:inherit;overflow:hidden}
.playing-card.red{color:#e53935}
.playing-card.gold-face{color:#d4a017}
.playing-card.gold-face .pc-corner .rank,
.playing-card.gold-face .pc-corner .suit,
.playing-card.gold-face .pc-ace,
.playing-card.gold-face .pc-royal,
.playing-card.gold-face .pc-royal small{color:#d4a017}
.playing-card.gold-face .pc-face{background:linear-gradient(135deg,#fff7cc,#fff1a8 45%,#e7c75f);border-color:#d4a017}
.playing-card.gold-face .pc-corner{box-shadow:0 0 0 1px #f1d77a inset}
.pc-corner{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;line-height:.82;font-weight:700;font-family:Arial,"Noto Sans JP",sans-serif}
.pc-corner .rank{font-size:20px;letter-spacing:-1px}.pc-corner .suit{font-size:17px;margin-top:3px}.pc-corner.tl{top:6px;left:6px}.pc-corner.br{right:6px;bottom:6px;transform:rotate(180deg)}
.pc-center{position:absolute;inset:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr);align-items:center;justify-items:center;font-size:20px;line-height:1}
.pc-pip{position:absolute;transform:translate(-50%,-50%);font-size:20px;line-height:1}.pc-pip.flip{transform:translate(-50%,-50%) rotate(180deg)}
.pc-ace{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:49px;line-height:1}
.pc-face{position:absolute;left:18px;right:18px;top:15px;bottom:15px;border:1px solid #d8d8d8;border-radius:4px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8f1d5,#fff 45%,#f4e5b4);overflow:hidden}
.pc-face::before,.pc-face::after{content:"";position:absolute;width:65%;height:140%;background:repeating-linear-gradient(45deg,transparent 0 7px,currentColor 7px 9px);opacity:.08;transform:rotate(18deg)}
.pc-face::after{transform:rotate(-18deg)}
.pc-royal{position:relative;z-index:2;font-size:32px;font-weight:700;text-shadow:1px 1px 0 #fff}.pc-royal small{display:block;font-size:18px;margin-top:3px}
@media(max-width:700px){.pc-corner .rank{font-size:15px}.pc-corner .suit{font-size:13px;margin-top:2px}.pc-corner.tl{top:4px;left:4px}.pc-corner.br{right:4px;bottom:4px}.pc-pip{font-size:15px}.pc-ace{font-size:37px}.pc-face{left:13px;right:13px;top:11px;bottom:11px}.pc-royal{font-size:24px}.pc-royal small{font-size:13px}}

/* Keep pip symbols clear of the corner indexes, especially 10 */
.pc-pip{z-index:1}
.pc-corner{background:#fff;padding:1px 2px;border-radius:3px}
.playing-card.red .pc-corner{background:#fff}
@media(max-width:700px){.pc-corner{padding:0 1px}}


/* Special 7-2 victory effect: horses race around the winner */
.player.seven-two-win{
  position:relative;
  z-index:3;
  overflow:visible;
  border:3px solid #ffd700;
  box-shadow:0 0 10px #ffd70088;
}
.player.seven-two-win::after{
  content:"7-2 SPECIAL!";
  position:absolute;
  left:50%;
  top:-18px;
  transform:translateX(-50%);
  padding:5px 12px;
  border-radius:999px;
  background:#ffd700;
  color:#111;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 0 14px #ffd70088;
  z-index:8;
  animation:sevenTwoBadge .7s ease-out both;
}
@keyframes sevenTwoBadge{
  from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.6)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}

.horse-track{
  position:absolute;
  inset:-30px;
  pointer-events:none;
  z-index:7;
  overflow:visible;
}
.horse-runner{
  position:absolute;
  left:0;
  top:0;
  font-size:30px;
  line-height:1;
  filter:drop-shadow(0 2px 4px #0008) drop-shadow(0 0 7px #ffd700aa);
  will-change:left,top,transform;
  animation:horseLap 4.2s linear infinite reverse;
}
.horse-runner:nth-child(2){animation-delay:-.84s}
.horse-runner:nth-child(3){animation-delay:-1.68s}
.horse-runner:nth-child(4){animation-delay:-2.52s}
.horse-runner:nth-child(5){animation-delay:-3.36s}

@keyframes horseLap{
  0%{left:0;top:0;transform:translate(-50%,-50%) scaleX(1) rotate(0deg)}
  23%{left:100%;top:0;transform:translate(-50%,-50%) scaleX(1) rotate(0deg)}
  25%{left:100%;top:0;transform:translate(-50%,-50%) rotate(90deg)}
  48%{left:100%;top:100%;transform:translate(-50%,-50%) rotate(90deg)}
  50%{left:100%;top:100%;transform:translate(-50%,-50%) scaleX(-1) rotate(0deg)}
  73%{left:0;top:100%;transform:translate(-50%,-50%) scaleX(-1) rotate(0deg)}
  75%{left:0;top:100%;transform:translate(-50%,-50%) rotate(-90deg)}
  98%{left:0;top:0;transform:translate(-50%,-50%) rotate(-90deg)}
  100%{left:0;top:0;transform:translate(-50%,-50%) scaleX(1) rotate(0deg)}
}

@media(max-width:700px){
  .horse-track{inset:-24px}
  .horse-runner{font-size:24px}
}

.seven-two-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#ffd7001d 0,#00000000 55%);
  animation:sevenTwoOverlay 1.8s ease-out forwards;
}
.seven-two-overlay .seven-two-text{
  font-size:clamp(38px,9vw,92px);
  font-weight:1000;
  letter-spacing:2px;
  color:#fff;
  text-shadow:0 0 10px #fff,0 0 25px #ffd700,0 0 50px #ff6a00;
  transform:rotate(-4deg);
  animation:sevenTwoText 1.8s cubic-bezier(.2,.9,.2,1) forwards;
}
@keyframes sevenTwoOverlay{
  0%{opacity:0}15%{opacity:1}72%{opacity:1}100%{opacity:0}
}
@keyframes sevenTwoText{
  0%{opacity:0;transform:scale(.25) rotate(-10deg)}
  22%{opacity:1;transform:scale(1.18) rotate(3deg)}
  40%{transform:scale(.96) rotate(-2deg)}
  70%{opacity:1;transform:scale(1) rotate(-4deg)}
  100%{opacity:0;transform:scale(1.3) rotate(-4deg)}
}


/* TURN / RIVER: enlarge only the card currently being squeezed */
.squeeze-card.big-reveal{
  position:fixed;
  left:50%;
  top:50%;
  width:175px;
  height:250px;
  transform:translate(-50%,-50%);
  z-index:950;
  border-radius:16px;
  filter:drop-shadow(0 18px 35px #000c) drop-shadow(0 0 16px #ffffff22);
}
.squeeze-card.big-reveal .squeeze-face,
.squeeze-card.big-reveal .squeeze-cover,
.squeeze-card.big-reveal .playing-card{border-radius:16px}
.squeeze-card.big-reveal .pc-corner .rank{font-size:38px}
.squeeze-card.big-reveal .pc-corner .suit{font-size:30px;margin-top:5px}
.squeeze-card.big-reveal .pc-corner.tl{top:12px;left:12px}
.squeeze-card.big-reveal .pc-corner.br{right:12px;bottom:12px}
.squeeze-card.big-reveal .pc-pip{font-size:39px}
.squeeze-card.big-reveal .pc-ace{font-size:95px}
.squeeze-card.big-reveal .pc-face{left:32px;right:32px;top:28px;bottom:28px}
.squeeze-card.big-reveal .pc-royal{font-size:58px}
.squeeze-card.big-reveal .pc-royal small{font-size:31px}
.squeeze-card.big-reveal .squeeze-cover::after{font-size:66px}
@media(max-width:700px){
  .squeeze-card.big-reveal{
    width:150px;
    height:214px;
    top:52%;
  }
  .squeeze-card.big-reveal .pc-corner .rank{font-size:32px}
  .squeeze-card.big-reveal .pc-corner .suit{font-size:25px}
  .squeeze-card.big-reveal .pc-corner.tl{top:10px;left:10px}
  .squeeze-card.big-reveal .pc-corner.br{right:10px;bottom:10px}
  .squeeze-card.big-reveal .pc-pip{font-size:33px}
  .squeeze-card.big-reveal .pc-ace{font-size:80px}
  .squeeze-card.big-reveal .pc-face{left:27px;right:27px;top:24px;bottom:24px}
  .squeeze-card.big-reveal .pc-royal{font-size:49px}
  .squeeze-card.big-reveal .pc-royal small{font-size:26px}
  .squeeze-card.big-reveal .squeeze-cover::after{font-size:56px}
}

</style></head><body>
<div class="game">
<h1>♠ ALL IN ♠</h1><div class="subtitle">POKER DUEL</div>
<div class="setup"><label for="count">参加人数</label><select id="count"></select></div>
<div class="players" id="players"></div>
<div class="equity"><div class="small" id="method">勝率を計算中...</div></div>
<div class="board-title">BOARD</div><div class="board" id="board"></div><div class="squeeze-help" id="squeezeHelp"></div>
<div class="result" id="result"></div>
<button id="action">ALL IN !!</button><button id="random">ランダムで配る</button>
</div>
<div class="modal" id="modal"><div class="box"><div class="head"><h2>カードを選択</h2><button class="close" id="close">閉じる</button></div><div id="picker"></div></div></div>
<script>
const suits=["♠","♥","♦","♣"],ranks=[["A",14],["K",13],["Q",12],["J",11],["10",10],["9",9],["8",8],["7",7],["6",6],["5",5],["4",4],["3",3],["2",2]];
let playerCount=2,players=[],board=[],deck=[],stage="pre",editing=null,calcToken=0,revealedBoard=0,revealBusy=false;
const $=id=>document.getElementById(id),playersEl=$("players"),be=$("board"),res=$("result"),modal=$("modal"),picker=$("picker"),action=$("action"),random=$("random"),count=$("count"),squeezeHelp=$("squeezeHelp");
for(let n=2;n<=8;n++){let o=document.createElement("option");o.value=n;o.textContent=n+"人";count.appendChild(o)}
function makeDeck(){return suits.flatMap(s=>ranks.map(([rank,value])=>({suit:s,rank,value})))}function key(c){return c.rank+c.suit}
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function cardFace(c){
  let root=document.createElement("div");root.className="playing-card"+("♥♦".includes(c.suit)?" red":"")+(["A","J","Q","K"].includes(c.rank)?" gold-face":"");
  const corner=pos=>{let z=document.createElement("div");z.className="pc-corner "+pos;z.innerHTML=`<span class="rank">${c.rank}</span><span class="suit">${c.suit}</span>`;return z};
  root.append(corner("tl"),corner("br"));
  if(c.rank==="A"){let a=document.createElement("div");a.className="pc-ace";a.textContent=c.suit;root.appendChild(a);return root}
  if(["J","Q","K"].includes(c.rank)){let f=document.createElement("div");f.className="pc-face";let r=document.createElement("div");r.className="pc-royal";r.innerHTML=`${c.rank}<small>${c.suit}</small>`;f.appendChild(r);root.appendChild(f);return root}
  const layouts={
    "2":[[50,24],[50,76]],"3":[[50,20],[50,50],[50,80]],"4":[[30,25],[70,25],[30,75],[70,75]],
    "5":[[30,22],[70,22],[50,50],[30,78],[70,78]],"6":[[30,20],[70,20],[30,50],[70,50],[30,80],[70,80]],
    "7":[[30,18],[70,18],[50,35],[30,50],[70,50],[30,82],[70,82]],"8":[[30,17],[70,17],[50,33],[30,43],[70,43],[50,67],[30,83],[70,83]],
    "9":[[30,16],[70,16],[30,35],[70,35],[50,50],[30,65],[70,65],[30,84],[70,84]],
    "10":[[30,14],[70,14],[50,28],[30,37],[70,37],[30,63],[70,63],[50,72],[30,86],[70,86]]};
  (layouts[c.rank]||[]).forEach(([x,y])=>{let p=document.createElement("span");p.className="pc-pip"+(y>50?" flip":"");p.style.left=x+"%";p.style.top=y+"%";p.textContent=c.suit;root.appendChild(p)});return root
}
function ce(c,click,p,i){let d=document.createElement("div");d.className="card";d.appendChild(cardFace(c));if(click)d.onclick=()=>openPick(p,i);else d.style.cursor="default";return d}
function renderPlayers(){let saved=players.map((_,p)=>{let e=$("eq"+p);return e?e.textContent:"--"});playersEl.innerHTML="";players.forEach((hand,p)=>{let box=document.createElement("div");box.className="player";box.innerHTML=`<h2>PLAYER ${p+1}</h2>`;let cs=document.createElement("div");cs.className="cards";hand.forEach((c,i)=>cs.appendChild(ce(c,stage==="pre",p,i)));box.appendChild(cs);let eq=document.createElement("div");eq.className="player-equity";eq.id="eq"+p;eq.textContent=saved[p]||"--";box.appendChild(eq);playersEl.appendChild(box)})}
function squeezeCard(c,index){let isBig=(index===revealedBoard&&(stage==="turn"||stage==="river"));let wrap=document.createElement("div");wrap.className="squeeze-card"+(index<revealedBoard?" revealed":"")+(isBig?" big-reveal":"");let face=document.createElement("div");face.className="squeeze-face";face.appendChild(cardFace(c));let cover=document.createElement("div");cover.className="squeeze-cover";wrap.append(face,cover);if(index===revealedBoard){let startY=0,progress=0,active=false,dragDistance=isBig?160:90;const paint=()=>{let p=Math.max(0,Math.min(1,progress));cover.style.transform=`translateY(${-p*82}%) rotateX(${-p*20}deg)`;cover.style.clipPath=`inset(0 0 ${p*88}% 0)`};const begin=e=>{if(revealBusy)return;active=true;wrap.classList.add("squeezing");startY=e.clientY;progress=0;wrap.setPointerCapture?.(e.pointerId);e.preventDefault()};const move=e=>{if(!active)return;progress=Math.max(0,(startY-e.clientY)/dragDistance);paint();e.preventDefault()};const end=async e=>{if(!active)return;active=false;wrap.classList.remove("squeezing");if(progress>=.48){revealBusy=true;revealedBoard++;wrap.classList.add("revealed");cover.style.transform="";cover.style.clipPath="";await afterReveal();revealBusy=false}else{progress=0;paint()}e.preventDefault()};wrap.addEventListener("pointerdown",begin);wrap.addEventListener("pointermove",move);wrap.addEventListener("pointerup",end);wrap.addEventListener("pointercancel",end)}return wrap}
function showBoard(){be.innerHTML="";board.forEach((c,i)=>be.appendChild(squeezeCard(c,i)));for(let i=board.length;i<5;i++){let x=document.createElement("div");x.className="placeholder";x.textContent="?";be.appendChild(x)}squeezeHelp.textContent=revealedBoard<board.length?"カードを上にスライドして絞る":""}
async function afterReveal(){showBoard();if(revealedBoard<board.length)return;res.textContent=stage.toUpperCase();await updateEquity();renderPlayers();if(stage==="river"){finalResult();action.textContent="勝負終了";action.disabled=true;random.disabled=false;count.disabled=false}else{action.disabled=false;random.disabled=false;count.disabled=false;action.textContent=stage==="flop"?"TURNを配る":"RIVERを配る"}}
function allHole(){return players.flat()}function remaining(){let u=new Set([...allHole(),...board].map(key));return makeDeck().filter(c=>!u.has(key(c)))}
function resetStage(){stage="pre";board=[];revealedBoard=0;revealBusy=false;showBoard();res.innerHTML="";action.textContent="ALL IN !!";action.disabled=false}
function deal(){let d=makeDeck();shuffle(d);players=Array.from({length:playerCount},()=>[d.pop(),d.pop()]);resetStage();renderPlayers();updateEquity()}
function openPick(p,i){if(stage!=="pre")return;editing={p,i};picker.innerHTML="";let used=new Set(allHole().map(key));used.delete(key(players[p][i]));
suits.forEach(s=>{let row=document.createElement("div");row.className="srow",lab=document.createElement("div");lab.className="slab";lab.textContent=s;if("♥♦".includes(s))lab.style.color="#d52b2b";row.appendChild(lab);ranks.forEach(([rank,value])=>{let b=document.createElement("button");b.className="pick"+("♥♦".includes(s)?" r":"");b.textContent=rank;let c={suit:s,rank,value};b.disabled=used.has(key(c));b.onclick=()=>{players[p][i]=c;modal.classList.remove("open");resetStage();renderPlayers();updateEquity()};row.appendChild(b)});picker.appendChild(row)});modal.classList.add("open")}
$("close").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
function combos(a,n){let o=[];function f(s,x){if(x.length===n){o.push(x.slice());return}for(let i=s;i<a.length;i++){x.push(a[i]);f(i+1,x);x.pop()}}f(0,[]);return o}
function eval5(cs){let v=cs.map(c=>c.value).sort((a,b)=>b-a),ss=cs.map(c=>c.suit),ct={};v.forEach(x=>ct[x]=(ct[x]||0)+1);let g=Object.entries(ct).map(([x,c])=>({v:+x,c})).sort((a,b)=>b.c-a.c||b.v-a.v),u=[...new Set(v)].sort((a,b)=>b-a);if(u.includes(14)&&u.includes(5)&&u.includes(4)&&u.includes(3)&&u.includes(2))u.push(1);let sh=null;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){sh=u[i];break}let fl=ss.every(s=>s===ss[0]);
if(sh&&fl)return{score:[8,sh],name:sh===14?"ロイヤルフラッシュ":"ストレートフラッシュ"};if(g[0].c===4)return{score:[7,g[0].v,g[1].v],name:"フォーカード"};if(g[0].c===3&&g[1].c===2)return{score:[6,g[0].v,g[1].v],name:"フルハウス"};if(fl)return{score:[5,...v],name:"フラッシュ"};if(sh)return{score:[4,sh],name:"ストレート"};if(g[0].c===3)return{score:[3,g[0].v,...g.filter(x=>x.c===1).map(x=>x.v).sort((a,b)=>b-a)],name:"スリーカード"};if(g[0].c===2&&g[1].c===2){let ps=[g[0].v,g[1].v].sort((a,b)=>b-a);return{score:[2,...ps,g.find(x=>x.c===1).v],name:"ツーペア"}}if(g[0].c===2)return{score:[1,g[0].v,...g.filter(x=>x.c===1).map(x=>x.v).sort((a,b)=>b-a)],name:"ワンペア"};return{score:[0,...v],name:"ハイカード"}}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let x=a[i]||0,y=b[i]||0;if(x>y)return 1;if(x<y)return-1}return 0}
function best(cs){let z=null;for(let c of combos(cs,5)){let e=eval5(c);if(!z||cmp(e.score,z.score)>0)z=e}return z}
function winners(extra=[]){let hs=players.map(h=>best([...h,...board,...extra])),win=[0];for(let i=1;i<hs.length;i++){let c=cmp(hs[i].score,hs[win[0]].score);if(c>0)win=[i];else if(c===0)win.push(i)}return {win,hs}}
function setEq(shares,total,label){shares.forEach((v,i)=>{$("eq"+i).textContent=(100*v/total).toFixed(1)+"%"});$("method").textContent=label}
async function updateEquity(){const token=++calcToken;$("method").textContent="勝率を計算中...";await new Promise(r=>setTimeout(r,15));if(token!==calcToken)return;let rem=remaining(),need=5-board.length,shares=Array(playerCount).fill(0),total=0;
function add(extra){let w=winners(extra).win,share=1/w.length;w.forEach(i=>shares[i]+=share);total++}
if(need===0){add([]);setEq(shares,total,"RIVER：勝敗確定");return}
if(need<=2){for(let x of combos(rem,need))add(x);if(token!==calcToken)return;setEq(shares,total,need===2?"FLOP：残り全組み合わせを正確に計算":"TURN：残り全カードを正確に計算");return}
const N=20000;for(let n=0;n<N;n++){let pool=rem.slice();shuffle(pool);add(pool.slice(0,need))}if(token!==calcToken)return;setEq(shares,total,"")}
function finalResult(){
  let x=winners(),names=x.win.map(i=>"PLAYER "+(i+1));
  document.querySelectorAll(".player").forEach(el=>{el.classList.remove("winner","seven-two-win");el.querySelector(".horse-track")?.remove()});
  x.win.forEach(i=>document.querySelectorAll(".player")[i].classList.add("winner"));

  let special72=false;
  if(x.win.length===1){
    let wi=x.win[0];
    let rs=players[wi].map(c=>c.rank).sort();
    special72=(rs[0]==="2"&&rs[1]==="7");
    if(special72){
      let winnerBox=document.querySelectorAll(".player")[wi];
      winnerBox.classList.add("seven-two-win");
      winnerBox.querySelector(".horse-track")?.remove();
      let horseTrack=document.createElement("div");
      horseTrack.className="horse-track";
      horseTrack.innerHTML='<span class="horse-runner">🐎</span><span class="horse-runner">🐎</span><span class="horse-runner">🐎</span><span class="horse-runner">🐎</span><span class="horse-runner">🐎</span>';
      winnerBox.appendChild(horseTrack);
      let oldOverlay=document.querySelector(".seven-two-overlay");
      if(oldOverlay)oldOverlay.remove();
      let ov=document.createElement("div");
      ov.className="seven-two-overlay";
      ov.innerHTML='<div class="seven-two-text">🔥 7-2 WIN!! 🔥</div>';
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(),1900);
    }
  }

  if(x.win.length===1)res.innerHTML=(special72?"🔥 7-2 SPECIAL WIN!! 🔥<br>":"🏆 ")+names[0]+" WIN !!<span class='hand-name'>"+x.hs[x.win[0]].name+"</span>";
  else res.innerHTML="🤝 SPLIT POT："+names.join(" / ")+"<span class='hand-name'>"+x.hs[x.win[0]].name+"</span>"
}
async function nextStage(){if(revealBusy||revealedBoard<board.length)return;action.disabled=true;random.disabled=true;count.disabled=true;if(stage==="pre"){deck=remaining();shuffle(deck);board.push(deck.pop(),deck.pop(),deck.pop());stage="flop";showBoard();res.textContent="FLOPを絞ってください"}else if(stage==="flop"){board.push(deck.pop());stage="turn";showBoard();res.textContent="TURNを絞ってください"}else if(stage==="turn"){board.push(deck.pop());stage="river";showBoard();res.textContent="RIVERを絞ってください"}action.textContent="絞り中..."}
count.onchange=()=>{playerCount=+count.value;deal()};random.onclick=deal;action.onclick=nextStage;deal();
</script></body></html>
